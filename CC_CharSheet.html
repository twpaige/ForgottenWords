<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crown & Call — Character Sheet</title>
<style>
  :root {
    --bg: #1a1e24;
    --card: #2b3138;
    --ink: #f0f0f0;
    --mute: #8b949e;
    --line: #171a1d;
    --gold: #d8a400;
    --btn: #4a525b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 6px 10px 16px;
  }
  h1 { margin: 0; font-size: 18px; text-align: center; font-weight: normal; }
  .sub { margin: 2px 0 6px; text-align: center; color: var(--mute); font-size: 11px; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    margin: 0 0 4px;
  }
  .toolbar button, .toolbar label.filebtn {
    border: 0;
    border-radius: 6px;
    background: var(--btn);
    color: #fff;
    min-height: 24px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .toolbar label.filebtn { display: inline-flex; align-items: center; }
  .toolbar input[type=file] { display: none; }
  .toast { text-align: center; color: var(--mute); font-size: 11px; min-height: 12px; margin: 0 0 6px; }
  .seat {
    background: var(--card);
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,.35);
  }
  .seat input, .seat select {
    width: 100%;
    border: 0;
    border-radius: 6px;
    background: var(--line);
    color: var(--ink);
    padding: 4px 6px;
    font-size: 13px;
    min-height: 26px;
  }
  .seat input[type=checkbox] {
    width: 12px;
    height: 12px;
    min-height: 12px;
    padding: 0;
  }
  .seat input[type=number] { font-variant-numeric: tabular-nums; }
  .name-row { display: grid; grid-template-columns: 1.2fr .8fr; gap: 6px; margin-bottom: 6px; }
  .caps {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 4px;
  }
  .cap { min-width: 0; }
  .cap label, .mini label, .wlab {
    display: block;
    color: var(--mute);
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .cap .line { display: grid; grid-template-columns: 1fr 28px; gap: 4px; align-items: center; }
  .eff { text-align: right; font-weight: bold; font-size: 16px; }
  .eff.hurt { color: #e2b34a; }
  .sum {
    margin: 0 0 6px;
    color: var(--mute);
    font-size: 11px;
    line-height: 1.3;
  }
  .mini-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 4px;
  }
  .flags {
    display: flex;
    flex-wrap: nowrap;
    gap: 12px;
    align-items: center;
    margin: 2px 0 4px;
    color: #d5dbe0;
    white-space: nowrap;
    font-size: 11px;
    line-height: 1;
  }
  .flags label {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    font-size: 11px;
    margin: 0;
  }
  .flags input[type=checkbox] {
    width: 12px;
    height: 12px;
    min-height: 12px;
    margin: 0;
    padding: 0;
    accent-color: var(--gold);
    flex: 0 0 12px;
  }
  .wep {
    display: grid;
    grid-template-columns: minmax(90px, 1.4fr) 44px 44px 56px 92px 88px;
    gap: 5px;
    margin-bottom: 4px;
    align-items: center;
  }
  .wep-head span {
    color: var(--mute);
    font-size: 9px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .plain {
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .plain::-webkit-outer-spin-button,
  .plain::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .wounds {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 5px;
    margin-top: 5px;
  }
  .wcell { min-width: 0; }
  .wcell .bit {
    text-align: center;
    border-radius: 6px 6px 0 0;
    font-size: 12px;
    font-weight: bold;
    min-height: 26px;
    line-height: 26px;
  }
  .bit.high { background: var(--gold); color: #17120a; }
  .bit.low { background: var(--line); color: #777f87; }
  .wpm { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .wpm button {
    min-height: 26px;
    font-size: 16px;
    line-height: 1;
    border-radius: 0 0 6px 6px;
    padding: 0;
  }
  button {
    border: 0;
    border-radius: 6px;
    background: var(--btn);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
  .reset {
    width: 100%;
    margin-top: 4px;
    min-height: 24px;
    font-size: 11px;
  }
  .live {
    margin-top: 5px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
  }
  .mod {
    background: var(--line);
    border-radius: 5px;
    padding: 3px 6px;
  }
  .mod span { display: block; color: var(--mute); font-size: 9px; text-transform: uppercase; line-height: 1.2; }
  .mod b { display: block; font-size: 14px; font-weight: bold; margin-top: 0; line-height: 1.2; }
  .notes {
    margin-top: 5px;
    background: var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 11px;
    line-height: 1.35;
    color: #d5dbe0;
  }
  .warn { color: #e2b34a; }
  .foot { margin: 8px 0 0; text-align: center; color: var(--mute); font-size: 11px; }
  @media (max-width: 640px) {
    .caps { grid-template-columns: 1fr 1fr; }
    .wep { grid-template-columns: 1fr 1fr 1fr; }
    .live { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Crown &amp; Call</h1>
  <p class="sub">Play sheet · Save writes this browser only · JSON file for work PCs</p>
  <div class="toolbar">
    <button type="button" id="saveLocal">Save in browser</button>
    <button type="button" id="downloadJson">Download JSON</button>
    <label class="filebtn">Load JSON<input type="file" id="loadJson" accept="application/json,.json"></label>
  </div>
  <p class="toast" id="toast"></p>

  <div class="seat">
    <div class="name-row">
      <div>
        <label class="wlab" for="name">Name</label>
        <input id="name" type="text" placeholder="Name">
      </div>
      <div>
        <label class="wlab" for="who">Who they are</label>
        <input id="who" type="text" placeholder="warrior-priest, hedge caller…">
      </div>
    </div>

    <div class="caps" id="caps"></div>
    <div class="sum" id="capSum"></div>

    <div class="mini-row">
      <div class="mini">
        <label for="baseSpeed">Base Speed</label>
        <input id="baseSpeed" type="number" value="30">
      </div>
      <div class="mini">
        <label for="armor">Armor</label>
        <select id="armor">
          <option value="1">None (+1 severity)</option>
          <option value="0" selected>Leather (0)</option>
          <option value="-1">Chain (−1)</option>
          <option value="-2">Plate (−2)</option>
        </select>
      </div>
      <div class="mini">
        <label for="agg">Aggression</label>
        <input id="agg" type="number" value="0" min="-10" max="10">
      </div>
    </div>
    <div class="flags">
      <label><input id="adjacent" type="checkbox"> Adjacent</label>
      <label><input id="guidance" type="checkbox"> Guidance</label>
    </div>

    <div class="wlab">Weapons</div>
    <div class="wep wep-head">
      <span>Name</span><span>1H</span><span>2H</span><span>Ceil</span><span>Used with</span><span>Kind</span>
    </div>
    <div id="weapons">
      <div class="wep">
        <input id="aname" type="text" placeholder="Weapon A">
        <input class="plain" id="a1h" type="text" inputmode="numeric" value="0" title="1H">
        <input class="plain" id="a2h" type="text" inputmode="numeric" value="0" title="2H">
        <input id="aceil" type="text" placeholder="ceil">
        <select id="astat"><option value="weapons" selected>WEAPONS</option><option value="ranged">RANGED</option></select>
        <select id="akind"><option value="melee" selected>Melee</option><option value="ranged">Ranged</option></select>
      </div>
      <div class="wep">
        <input id="bname" type="text" placeholder="Weapon B">
        <input class="plain" id="b1h" type="text" inputmode="numeric" value="0" title="1H">
        <input class="plain" id="b2h" type="text" inputmode="numeric" value="0" title="2H">
        <input id="bceil" type="text" placeholder="ceil">
        <select id="bstat"><option value="weapons" selected>WEAPONS</option><option value="ranged">RANGED</option></select>
        <select id="bkind"><option value="melee" selected>Melee</option><option value="ranged">Ranged</option></select>
      </div>
      <div class="wep">
        <input id="cname" type="text" placeholder="Weapon C">
        <input class="plain" id="c1h" type="text" inputmode="numeric" value="0" title="1H">
        <input class="plain" id="c2h" type="text" inputmode="numeric" value="0" title="2H">
        <input id="cceil" type="text" placeholder="ceil">
        <select id="cstat"><option value="ranged" selected>RANGED</option><option value="weapons">WEAPONS</option></select>
        <select id="ckind"><option value="ranged" selected>Ranged</option><option value="melee">Melee</option></select>
      </div>
    </div>

    <div class="wounds" id="bits"></div>
    <button class="reset" id="reset" type="button">RESET WOUNDS</button>
    <div class="sum" id="woundSum"></div>

    <div class="live" id="mods"></div>
    <div class="notes" id="notes"></div>
  </div>
  <p class="foot">Ver. 202609191618 · © 2026 Thomas Paige · playtest, not for redistribution</p>
</div>

<script>
const CAPS = [
  ["weapons", "WEAPONS", true],
  ["ranged", "RANGED", true],
  ["athletics", "ATHLETICS", true],
  ["thievery", "THIEVERY", true],
  ["sense", "SENSE", true],
  ["magic", "MAGIC", false],
  ["academics", "ACADEMICS", false],
  ["faith", "FAITH", false]
];

const BITS = [
  { v: 32, name: "MORT", lvl: 6 },
  { v: 16, name: "GRAV", lvl: 5 },
  { v: 8,  name: "SEVR", lvl: 4 },
  { v: 4,  name: "DEEP", lvl: 3 },
  { v: 2,  name: "LITE", lvl: 2 },
  { v: 1,  name: "FLSH", lvl: 1 }
];

let total = 0;

function n(id) {
  const el = document.getElementById(id);
  const v = parseInt(el.value, 10);
  return Number.isFinite(v) ? v : 0;
}
function cap(id) {
  return Math.max(0, Math.min(20, n(id)));
}
function woundLevel() {
  for (const b of BITS) if (total & b.v) return b.lvl;
  return 0;
}
function worstName() {
  for (const b of BITS) if (total & b.v) return b.name;
  return "none";
}
function speed() {
  return Math.ceil((n("baseSpeed") + cap("athletics")) / 5) * 5;
}
function meleeAgg() {
  if (!document.getElementById("adjacent").checked) return 0;
  let a = n("agg");
  if (a > 10) a = 10;
  if (a < -10) a = -10;
  return a;
}
function pair(a, b) {
  return signed(a) + " / " + signed(b);
}
function signed(v) {
  return (v >= 0 ? "+" : "") + v;
}

function buildCaps() {
  const box = document.getElementById("caps");
  box.innerHTML = "";
  CAPS.forEach(([id, label]) => {
    const wrap = document.createElement("div");
    wrap.className = "cap";
    wrap.innerHTML =
      `<label for="${id}">${label}</label>` +
      `<div class="line"><input id="${id}" type="number" min="0" max="20" value="0">` +
      `<span class="eff" id="eff-${id}">0</span></div>`;
    box.appendChild(wrap);
    wrap.querySelector("input").addEventListener("input", render);
  });
}

function bindWeapons() {
  document.querySelectorAll("#weapons input, #weapons select").forEach(i => {
    i.addEventListener("input", render);
    i.addEventListener("change", render);
  });
}

function buildBits() {
  const box = document.getElementById("bits");
  box.innerHTML = "";
  BITS.forEach((b, index) => {
    const cell = document.createElement("div");
    cell.className = "wcell";
    const bit = document.createElement("div");
    bit.className = "bit low";
    bit.id = "bit-" + index;
    bit.textContent = b.name;
    const pm = document.createElement("div");
    pm.className = "wpm";
    const minus = document.createElement("button");
    minus.type = "button";
    minus.textContent = "−";
    minus.addEventListener("click", () => changeTotal(-b.v));
    const plus = document.createElement("button");
    plus.type = "button";
    plus.textContent = "+";
    plus.addEventListener("click", () => changeTotal(b.v));
    pm.append(minus, plus);
    cell.append(bit, pm);
    box.appendChild(cell);
  });
}

function changeTotal(amount) {
  total += amount;
  if (total < 0) total = 0;
  if (total > 63) total = 63;
  render();
}

function render() {
  const wl = woundLevel();
  const agg = meleeAgg();
  const spent = CAPS.reduce((s, [id]) => s + cap(id), 0);

  CAPS.forEach(([id, , penalized]) => {
    const raw = cap(id);
    const eff = penalized ? raw - wl : raw;
    const node = document.getElementById("eff-" + id);
    node.textContent = eff;
    node.className = "eff" + (penalized && wl ? " hurt" : "");
  });

  document.getElementById("capSum").innerHTML =
    `Points on the sheet: <b>${spent}</b> · start is 15 across five CAPs (C3). Number at right is the roll bonus after C5.`;

  BITS.forEach((b, i) => {
    const cell = document.getElementById("bit-" + i);
    cell.className = "bit " + ((total & b.v) ? "high" : "low");
  });

  const wpen = wl ? `−${wl} ${worstName()}` : "0";
  document.getElementById("woundSum").innerHTML =
    `Value ${total} FLSH units · worst rung <b>${worstName()}</b> · C5 penalty <b>${wpen}</b>` +
    (total >= 32 ? ` <span class="warn">· MORT: down and dying (W6)</span>` : "");

  const weap = cap("weapons") - wl;
  const rang = cap("ranged") - wl;
  const ath = cap("athletics") - wl;
  const mag = cap("magic");
  const faith = cap("faith");

  function line(prefix) {
    const kind = document.getElementById(prefix + "kind").value;
    const stat = document.getElementById(prefix + "stat").value;
    const capv = stat === "ranged" ? rang : weap;
    const extraOff = kind === "melee" ? agg : 0;
    const extraDef = kind === "melee" ? -agg : 0;
    return {
      off: pair(capv + n(prefix + "1h") + extraOff, capv + n(prefix + "2h") + extraOff),
      def: pair(capv + n(prefix + "1h") + extraDef, capv + n(prefix + "2h") + extraDef),
      name: (document.getElementById(prefix + "name").value || "").trim() || ("Weapon " + prefix.toUpperCase())
    };
  }
  const a = line("a");
  const b = line("b");
  const c = line("c");
  const dodgeDef = ath - agg;
  const spd = speed();
  const squares = spd / 5;
  const diag = Math.floor(squares / 2);
  let ceil = "DEEP";
  if (mag >= 16) ceil = "MORT";
  else if (mag >= 11) ceil = "GRAV";
  else if (mag >= 6) ceil = "SEVR";

  document.getElementById("mods").innerHTML = `
    <div class="mod"><span>${a.name} offense 1H / 2H</span><b>${a.off}</b></div>
    <div class="mod"><span>${a.name} defense 1H / 2H</span><b>${a.def}</b></div>
    <div class="mod"><span>${b.name} offense 1H / 2H</span><b>${b.off}</b></div>
    <div class="mod"><span>${b.name} defense 1H / 2H</span><b>${b.def}</b></div>
    <div class="mod"><span>${c.name} offense 1H / 2H</span><b>${c.off}</b></div>
    <div class="mod"><span>${c.name} defense 1H / 2H</span><b>${c.def}</b></div>
    <div class="mod"><span>Dodge (ATHLETICS, melee)</span><b>${signed(dodgeDef)}</b></div>
    <div class="mod"><span>Call / ceiling (M6)</span><b>${signed(mag)} · ${ceil}</b></div>
    <div class="mod"><span>Speed / squares</span><b>${spd} ft · ${squares} sq</b></div>
    <div class="mod"><span>Wound / C5 / Guidance</span><b>${worstName()} · ${wpen} · ${document.getElementById("guidance").checked ? "FAITH " + faith : "off"}</b></div>
    <div class="mod"><span>Aggression live</span><b>${document.getElementById("adjacent").checked ? signed(agg) : "0 not adjacent"}</b></div>
    <div class="mod"><span>Meditation (O6)</span><b>${faith * 15} min</b></div>
  `;

  const adj = document.getElementById("adjacent").checked;
  const notes = [];
  notes.push(`Add d20 (or the table's dice mode). MoV 1–4 FLSH, 5–8 LITE, 9–12 DEEP, 13–16 SEVR, 17–20 GRAV, 21+ MORT — then apply the weapon/Call ceiling and armor.`);
  notes.push(`Aggression in the boxes: ${adj ? signed(agg) : "0 (not adjacent)"}. Ranged rolls ignore it.`);
  notes.push(`Diagonal this Turn: at most ${diag} of ${squares} squares (T3).`);
  notes.push(`Meditation minutes today: ${faith * 15} (O6).`);
  if (document.getElementById("guidance").checked) notes.push(`Guidance ready: you may add FAITH (${faith}) to a combat roll after seeing the dice (F3).`);
  if (!adj && n("agg") !== 0) notes.push(`Aggression typed ${n("agg")} but you are not adjacent, so live melee mods use 0.`);
  document.getElementById("notes").innerHTML = notes.join("<br>");
}

const STORE = "cc-charsheet-v1";

function toast(msg) {
  document.getElementById("toast").textContent = msg;
}

function weaponState(prefix) {
  return {
    name: document.getElementById(prefix + "name").value,
    h1: n(prefix + "1h"),
    h2: n(prefix + "2h"),
    ceil: document.getElementById(prefix + "ceil").value,
    stat: document.getElementById(prefix + "stat").value,
    kind: document.getElementById(prefix + "kind").value
  };
}

function gatherState() {
  const caps = {};
  CAPS.forEach(([id]) => { caps[id] = cap(id); });
  return {
    name: document.getElementById("name").value,
    who: document.getElementById("who").value,
    caps,
    baseSpeed: n("baseSpeed"),
    armor: document.getElementById("armor").value,
    agg: n("agg"),
    adjacent: document.getElementById("adjacent").checked,
    guidance: document.getElementById("guidance").checked,
    wounds: total,
    a: weaponState("a"),
    b: weaponState("b"),
    c: weaponState("c")
  };
}

function applyWeapon(prefix, data) {
  if (!data) return;
  document.getElementById(prefix + "name").value = data.name || "";
  document.getElementById(prefix + "1h").value = data.h1 ?? 0;
  document.getElementById(prefix + "2h").value = data.h2 ?? 0;
  document.getElementById(prefix + "ceil").value = data.ceil || "";
  if (data.stat) document.getElementById(prefix + "stat").value = data.stat;
  if (data.kind) document.getElementById(prefix + "kind").value = data.kind;
}

function applyState(data) {
  if (!data || typeof data !== "object" || data.type === "cc-encounter-v1") return false;
  document.getElementById("name").value = data.name || "";
  document.getElementById("who").value = data.who || "";
  CAPS.forEach(([id]) => {
    if (data.caps && data.caps[id] != null) document.getElementById(id).value = data.caps[id];
  });
  if (data.baseSpeed != null) document.getElementById("baseSpeed").value = data.baseSpeed;
  if (data.armor != null) document.getElementById("armor").value = data.armor;
  if (data.agg != null) document.getElementById("agg").value = data.agg;
  document.getElementById("adjacent").checked = !!data.adjacent;
  document.getElementById("guidance").checked = !!data.guidance;
  total = Math.max(0, Math.min(63, parseInt(data.wounds, 10) || 0));
  applyWeapon("a", data.a);
  applyWeapon("b", data.b);
  applyWeapon("c", data.c);
  render();
  return true;
}

function saveLocal() {
  try {
    localStorage.setItem(STORE, JSON.stringify(gatherState()));
    toast("Saved in this browser. Not sent anywhere.");
  } catch (err) {
    toast("Browser would not save. Use Download JSON.");
  }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    return applyState(JSON.parse(raw));
  } catch (err) {
    return false;
  }
}

function downloadJson() {
  const blob = new Blob([JSON.stringify(gatherState(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  const name = (document.getElementById("name").value || "character").replace(/[^\w\-]+/g, "_");
  a.href = URL.createObjectURL(blob);
  a.download = "CC_" + name + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("JSON downloaded. Keep it with the sheet.");
}

function loadJsonFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      if (applyState(JSON.parse(reader.result))) toast("Loaded " + file.name);
      else toast("That file was not a character sheet.");
    } catch (err) {
      toast("Could not read that file.");
    }
  };
  reader.readAsText(file);
}

buildCaps();
bindWeapons();
buildBits();
["baseSpeed","armor","agg","adjacent","guidance","name","who"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});
document.getElementById("reset").addEventListener("click", () => { total = 0; render(); });
document.getElementById("saveLocal").addEventListener("click", saveLocal);
document.getElementById("downloadJson").addEventListener("click", downloadJson);
document.getElementById("loadJson").addEventListener("change", ev => {
  const file = ev.target.files && ev.target.files[0];
  if (file) loadJsonFile(file);
  ev.target.value = "";
});
if (loadLocal()) toast("Loaded last Save in browser.");
else render();
</script>
</body>
</html>
